name: Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend

      - name: Build and Push Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/taskflow-backend ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-backend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull the latest images from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend
            docker pull ${{ secrets.DOCKER_USERNAME }}/taskflow-backend
            
            # Restart the containers to use the new images
            docker-compose up -d
